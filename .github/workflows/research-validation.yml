name: Research validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analysis-tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install analysis dependencies
        run: python -m pip install --requirement requirements-analysis.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests ros2_ws/src/uav_control/launch

      - name: Run metric tests
        run: python -m unittest discover -s tests -v
